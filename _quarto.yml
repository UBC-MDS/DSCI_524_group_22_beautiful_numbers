project:
  type: website
  output-dir: _site

website:
  title: "Beautiful Numbers"
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Reference"
        href: reference/index.qmd

# tell quarto to read the generated sidebar
metadata-files:
  - reference/_sidebar.yml

# tell quarto to read the generated styles
format:
  html:
    css:
      - reference/_styles-quartodoc.css

quartodoc:
  # import name of src/beautifulnumbers
  package: beautifulnumbers

  # generated by quartodoc build
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css

  sections:
    - title: Reference
      desc: "API reference for the Beautiful Numbers package."
      contents:
        - binary
        - hexa
        - fib_seq
        - prime_list